<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/animations.css" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div class="app-wrapper">
      <!-- Header -->
      <header class="app-header">
        <div class="header-left">
          <span class="app-logo">✓</span>
          <h1 class="app-title">My Tasks</h1>
        </div>
        <div class="header-right">
          <span class="task-count" id="taskCount">0 tasks</span>
          <button class="btn btn--icon btn--clear-all" id="clearCompleted" title="Clear completed">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      </header>

      <!-- Filter Tabs -->
      <nav class="filter-bar" role="tablist" aria-label="Task filters">
        <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
        <button class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
        <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
        <span class="filter-indicator" id="filterIndicator"></span>
      </nav>

      <!-- Add Task Input -->
      <div class="input-section">
        <form class="add-task-form" id="addTaskForm" autocomplete="off">
          <div class="input-wrapper">
            <span class="input-icon">+</span>
            <input
              type="text"
              class="task-input"
              id="taskInput"
              placeholder="Add a new task…"
              maxlength="200"
              aria-label="New task"
            />
            <button type="submit" class="btn btn--primary" id="addBtn">Add</button>
          </div>
          <div class="datetime-row">
            <div class="datetime-field">
              <label class="datetime-label" for="taskDate">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                Date
              </label>
              <input type="date" class="datetime-input" id="taskDate" aria-label="Due date" />
            </div>
            <div class="datetime-field">
              <label class="datetime-label" for="taskTime">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                Time
              </label>
              <input type="time" class="datetime-input" id="taskTime" aria-label="Due time" />
            </div>
            <button type="button" class="btn btn--ghost btn--clear-dt" id="clearDatetime" title="Clear date &amp; time">Clear</button>
          </div>
        </form>
      </div>

      <!-- Task List -->
      <main class="task-list-section">
        <ul class="task-list" id="taskList" aria-label="Task list" role="list"></ul>
        <div class="empty-state" id="emptyState" aria-live="polite">
          <div class="empty-icon">📋</div>
          <p class="empty-title">No tasks yet</p>
          <p class="empty-sub">Add your first task above to get started</p>
        </div>
      </main>

      <!-- Progress Bar -->
      <footer class="app-footer">
        <div class="progress-bar-wrapper">
          <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
          <span class="progress-label" id="progressLabel">0% complete</span>
        </div>
      </footer>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="modalOverlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal">
        <h2 class="modal-title" id="modalTitle">Edit Task</h2>
        <input type="text" class="modal-input" id="modalInput" maxlength="200" aria-label="Edit task text" />
        <div class="modal-datetime-row">
          <div class="datetime-field">
            <label class="datetime-label" for="modalDate">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              Date
            </label>
            <input type="date" class="datetime-input" id="modalDate" aria-label="Due date" />
          </div>
          <div class="datetime-field">
            <label class="datetime-label" for="modalTime">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              Time
            </label>
            <input type="time" class="datetime-input" id="modalTime" aria-label="Due time" />
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn btn--ghost" id="modalCancel">Cancel</button>
          <button class="btn btn--primary" id="modalSave">Save</button>
        </div>
      </div>
    </div>

    <script src="js/store.js"></script>
    <script src="js/dom.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
